name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Native client checks and APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;29.0.14206865'
      - name: Set up repository-pinned Rust
        run: rustup show
      - name: Check and build native client
        working-directory: android
        run: |
          ./gradlew qualityCheck :app:assembleDebug --no-daemon
          ./gradlew :app:assembleRelease --no-daemon
      - name: Verify all native ELF and APK alignment
        run: |
          for abi in arm64-v8a x86_64; do
            python3 android/scripts/check-native-alignment.py "android/app/build/outputs/apk/debug/app-${abi}-debug.apk" --abi "$abi"
            python3 android/scripts/check-native-alignment.py "android/app/build/outputs/apk/release/app-${abi}-release-unsigned.apk" --abi "$abi"
          done
      - name: Upload APKs and check reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-client
          path: |
            android/app/build/outputs/apk/
            android/app/build/reports/
            android/core/*/build/reports/
            android/feature/*/build/reports/
          retention-days: 7
          if-no-files-found: ignore
