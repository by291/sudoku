name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Native client checks and APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;29.0.14206865'
      - name: Set up repository-pinned Rust
        run: rustup show
      - name: Cache Rust dependencies, native builds, and private tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
            .tools/wasm-bindgen
            android/.native-tools
          key: rust-android-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock', 'scripts/build-sudoku-wasm.mjs', 'android/scripts/build-native.sh') }}-${{ hashFiles('sudoku/**/*.rs', 'android/ffi/**/*.rs') }}
          restore-keys: |
            rust-android-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock', 'scripts/build-sudoku-wasm.mjs', 'android/scripts/build-native.sh') }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - name: Verify the current Web backup against the shared fixture
        run: |
          pnpm install --frozen-lockfile
          pnpm wasm:build
          pnpm exec vitest run --config android/interop/vitest.config.ts
      - name: Check and build native client
        working-directory: android
        run: |
          ./gradlew qualityCheck :app:assembleDebug --no-daemon
          ./gradlew :app:assembleRelease --no-daemon
      - name: Restore the actual Android backup through Web storage
        env:
          ANDROID_INTEROP_REIMPORT: '1'
        run: pnpm exec vitest run --config android/interop/vitest.config.ts
      - name: Verify all native ELF and APK alignment
        run: |
          for abi in arm64-v8a x86_64; do
            python3 android/scripts/check-native-alignment.py "android/app/build/outputs/apk/debug/app-${abi}-debug.apk" --abi "$abi"
            python3 android/scripts/check-native-alignment.py "android/app/build/outputs/apk/release/app-${abi}-release-unsigned.apk" --abi "$abi"
          done
      - name: Upload APKs and check reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-client
          path: |
            android/app/build/outputs/apk/
            android/app/build/reports/
            android/core/*/build/reports/
            android/core/domain/build/interop/
            android/feature/*/build/reports/
          retention-days: 7
          if-no-files-found: ignore
