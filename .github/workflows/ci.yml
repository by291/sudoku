name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  checks:
    name: Type, lint, unit, and build checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Set up repository-pinned Rust and WASM target
        run: rustup show

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check portable Rust source and dependencies
        run: |
          cargo fmt --all --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p sudoku-wasm --target wasm32-unknown-unknown --locked -- -D warnings
          cargo tree -p sudoku-core -e normal > core-dependencies.txt
          node -e "const fs = require('node:fs'); if (/wasm-bindgen|js-sys|web-sys|tokio|getrandom/.test(fs.readFileSync('core-dependencies.txt', 'utf8'))) process.exit(1)"

      - name: Compare complete native migration contracts
        run: node tests/migration/run.mjs --suite all --engine native

      - name: Check types
        run: pnpm typecheck

      - name: Check lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build production app
        run: pnpm build

      - name: Build subpath deployment
        run: pnpm build:subpath

      - name: Upload engine build and dependency evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-engine-build
          path: |
            core-dependencies.txt
            packages/sudoku-wasm/pkg/*.d.ts
            dist/assets/*.wasm
            dist-subpath/assets/*.wasm
          retention-days: 7
          if-no-files-found: error

  browsers:
    name: Browser tests (${{ matrix.project }})
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop
            browser: chromium
            workers: 2
          - project: mobile
            browser: chromium
            workers: 2
          - project: firefox
            browser: firefox
            workers: 2
          - project: webkit
            browser: webkit
            workers: 1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Set up repository-pinned Rust and WASM target
        run: rustup show

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install project browser and system dependencies
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Build production app
        run: pnpm build

      - name: Compare actual WASM migration contracts
        if: ${{ matrix.project != 'mobile' }}
        run: node tests/migration/run.mjs --suite all --engine wasm-${{ matrix.browser }}

      - name: Run browser tests
        run: >-
          pnpm exec playwright test
          --project=${{ matrix.project }}
          --workers=${{ matrix.workers }}
          --reporter='line,html'
          --grep-invert='@performance'
          --global-timeout=900000

      - name: Upload browser report and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
            .superpowers/worker-timings/
          retention-days: 7
          if-no-files-found: ignore
